function updateMouseMove(dt){if(!mouseTarget||workBusy||!run||shiftEnded)return;const dx=mouseTarget.x-p.x,dy=mouseTarget.y-p.y,d=Math.hypot(dx,dy);if(d<8){mouseTarget=null;velX=velY=0;moving=false;return}const desired=p.s*1.35,acc=.18;velX+=(dx/d*desired-velX)*acc;velY+=(dy/d*desired-velY)*acc;const sp=Math.hypot(velX,velY);if(sp>.05)tryMove(p.x+velX/sp*sp*dt,p.y+velY/sp*sp*dt);moving=true;if(Math.abs(dx)>Math.abs(dy))facing=dx>0?'right':'left';else facing=dy>0?'down':'up'}

function calcFactoryKPI(){
 const demand=Math.max(1,orderTarget),available=480, takt=available/demand;
 const rows=Object.entries(lineMetrics).map(([k,v])=>{const availability=Math.max(0,1-v.downtime/Math.max(1,480));const performance=Math.min(1,(v.produced*Math.max(1,v.ct))/Math.max(1,480));const quality=k==='QC'?Math.max(.5,1-botFactory.defects/Math.max(1,botFactory.qc)):1;return {k,availability,performance,quality,oee:availability*performance*quality}});
 const bottleneck=rows.reduce((a,b)=>a.oee<b.oee?a:b,rows[0]);
 return {takt,rows,bottleneck};
}

}

    const prev=hourlyOps.find(x=>x.hour===lastDeepBucket);

function v47Ensure(){v47State.warehouse=Object.assign({a:18,b:18,c:14},v47State.warehouse||{});v47State.rop=Object.assign({a:4,b:4,c:3},v47State.rop||{});v47State.forklift=Object.assign({x:145,status:'IDLE',load:{a:0,b:0,c:0},t:0},v47State.forklift||{});v47State.forklift.load=Object.assign({a:0,b:0,c:0},v47State.forklift.load||{});v47State.queue=Array.isArray(v47State.queue)?v47State.queue:[];v47State.cards=Array.isArray(v47State.cards)?v47State.cards:[]}
function v47Request(){
 v47Ensure();
 ['a','b','c'].forEach(function(k){
  var pending=v47State.queue.filter(function(q){return q.k===k}).reduce(function(n,q){return n+q.qty},0)+(v47State.forklift.load[k]||0);
  var need=Math.max(0,v47State.rop[k]-(inv[k]||0)-pending);
  if(need>0){var q=Math.min(4,need);v47State.queue.push({k:k,qty:q,created:mins});v47State.cards.push({k:k,qty:q,status:'WAIT',created:mins})}
 });

}
function v47Dispatch(){
 v47Ensure();if(v47State.forklift.status!=='IDLE'||!v47State.queue.length)return;
 var q=v47State.queue.shift(),f=v47State.forklift;
 f.status='LOADING';f.t=0;f.x=145;f.load={a:0,b:0,c:0};
 var got=Math.min(q.qty,v47State.warehouse[q.k]||0);
 if(got<=0){v47State.shortage++;v47State.cards.push({k:q.k,qty:q.qty,status:'SHORT',created:mins});f.status='IDLE';v47State.lastEvent='⛔ Kho hết '+q.k.toUpperCase();return}
 f.load[q.k]=got;v47State.warehouse[q.k]-=got;v47State.cards.forEach(function(c){if(c.k===q.k&&c.status==='WAIT')c.status='MOVE'});
 if(got<q.qty)v47State.queue.unshift({k:q.k,qty:q.qty-got,created:q.created});
}
function v47Deliver(){
 var f=v47State.forklift;
 ['a','b','c'].forEach(function(k){if(f.load[k]){inv[k]=Math.min(12,(inv[k]||0)+f.load[k]);v47State.delivered+=f.load[k]}});
 v47State.cards.forEach(function(c){if(c.status==='MOVE')c.status='DONE'});
 f.load={a:0,b:0,c:0};f.status='RETURN';f.t=0;v47State.lastEvent='🚜 Phúc giao vật tư vào line-side';toast('🚜 XE NÂNG giao vật tư');

function v47Tick(dt){
 if(!run||shiftEnded)return;v47Ensure();v47Request();

 if(f.status==='LOADING'){f.t=Math.min(1,f.t+dt/v47State.routeSec);f.x=145+(375-145)*f.t;if(f.t>=1)v47Deliver()}
 else if(f.status==='RETURN'){f.t=Math.min(1,f.t+dt/v47State.routeSec);f.x=375+(145-375)*f.t;if(f.t>=1){f.status='IDLE';f.x=145}}

}

 if(a==='material'){inv.a=Math.min(30,inv.a+3);inv.b=Math.min(30,inv.b+3);inv.c=Math.min(30,inv.c+3);managerStats.costs+=60;toast('📦 Cấp liệu tại chỗ +3 A/B/C')}

 if(v44State.quality.containment && botFactory.qc>0 && Math.random()<dt*.015){kpi=Math.min(100,kpi+.2)}
 if(machine.status==='ok'&&machine.wear>=82&&!v44State.maint.planned){v44State.alerts.unshift({t:Math.floor(mins),msg:'Máy sắp hỏng · nên PM ngay',level:'HIGH'});v44State.alerts=v44State.alerts.slice(0,8);if(!andon.active){andon={active:true,line:'A/B',reason:'Mòn máy cao',since:mins}}}
}
